name: syrk_compose_project

services:
  db:
    image: postgres:16
    container_name: syrk_db
    environment:
      POSTGRES_DB: syrk_db
      POSTGRES_USER: syrk_user
      POSTGRES_PASSWORD: syrk_password
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syrk_app
    depends_on:
      - db
